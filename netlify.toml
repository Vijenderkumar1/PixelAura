# Netlify Configuration File
# This tells Netlify how to build and deploy your site automatically.

[build]
  # The directory containing the static files of your website
  publish = "website"

  # No build command is needed for static HTML/CSS/JS websites
  command = ""

[[headers]]
  # Enable aggressive caching for static generated assets to speed up load times
  for = "/assets/images/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Enable standard caching for ZIP bundle downloads
  for = "/assets/bundles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
