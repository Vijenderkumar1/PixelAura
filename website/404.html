<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>404 Page Not Found – PixelAura</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --ink: #080810;
      --surface: #0E0E1A;
      --card: #131320;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.12);
      --text: #F3F3FB;
      --muted: #8E8EA8;
      --grad: linear-gradient(135deg, #7B4FFF 0%, #00F5D4 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Aurora Glows */
    .aurora {
      position: absolute;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
    }
    .aurora-1 {
      top: -10%;
      left: -10%;
      background: #7B4FFF;
    }
    .aurora-2 {
      bottom: -10%;
      right: -10%;
      background: #00F5D4;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px;
      max-width: 520px;
      width: 90%;
      background: rgba(14, 14, 26, 0.45);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 12px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      background: var(--grad);
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 8px 20px rgba(123,79,255,0.25);
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>

  <div class="container">
    <div class="icon">🎨</div>
    <h1>404 – Lost in Space?</h1>
    <p>We couldn't find the page you're looking for. It might have been moved, deleted, or is currently generating in our AI universe.</p>
    <a href="/" class="btn">Back to Homepage</a>
  </div>

</body>
</html>
